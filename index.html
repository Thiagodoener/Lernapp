<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Lernapp">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
  <title>Lernapp</title>
</head>
<body>
  <div id="app-shell">
    <header class="topbar">
      <div>
        <div class="eyebrow">PERSONAL · OFFLINE-FIRST</div>
        <h1 id="screen-title">Heute</h1>
      </div>
      <button id="install-button" class="secondary hidden">Installieren</button>
    </header>
    <main id="content" aria-live="polite"></main>
    <nav class="tabbar" aria-label="Hauptnavigation">
      <button data-tab="today" class="active"><span>⌂</span><small>Heute</small></button>
      <button data-tab="library"><span>▤</span><small>Bibliothek</small></button>
      <button data-tab="learn"><span>◉</span><small>Lernen</small></button>
      <button data-tab="progress"><span>↗</span><small>Fortschritt</small></button>
      <button data-tab="profile"><span>⚙</span><small>Profil</small></button>
    </nav>
  </div>
  <dialog id="modal">
    <form method="dialog" class="modal-card">
      <button class="modal-close" value="cancel" aria-label="Schließen">×</button>
      <div id="modal-content"></div>
    </form>
  </dialog>
  <input id="file-import" type="file" accept=".pdf,.txt,.md,text/plain,application/pdf" hidden>
  <input id="backup-import" type="file" accept="application/json,.json" hidden>
  <script type="module" src="ai-service.js"></script>
  <script type="module" src="import-ai.js"></script>
  <script type="module" src="app.js"></script>
  <script type="module" src="profile-ai-mode.js"></script>
  <script type="module" src="summaries-ai.js"></script>
  <script type="module" src="free-answer-ai.js"></script>
  <script type="module" src="exam-ai.js"></script>
  <script type="module" src="tutor-ai.js"></script>
  <script type="module" src="material-delete.js"></script>
</body>
</html>
