<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" id="theme-color" content="#f2f2f7">
  <script>
    // Muss vor dem ersten Zeichnen laufen, sonst blitzt kurz das falsche
    // Erscheinungsbild auf. Die Wahl liegt im localStorage, weil sie eine
    // Einstellung dieses Geraets ist und nicht zu den Lerndaten gehoert.
    (function(){
      var choice="auto";
      try{ choice=localStorage.getItem("lernapp-appearance")||"auto"; }catch(e){}
      var dark=choice==="dark"||(choice!=="light"&&window.matchMedia("(prefers-color-scheme: dark)").matches);
      document.documentElement.dataset.theme=dark?"dark":"light";
      document.getElementById("theme-color")?.setAttribute("content",dark?"#000000":"#f2f2f7");
    })();
  </script>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Lernapp">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
  <title>Lernapp</title>
</head>
<body>
  <div id="app-shell">
    <header class="topbar" id="topbar">
      <div class="nav-inline">
        <span class="nav-inline-title" id="screen-title-inline">Heute</span>
        <button id="install-button" class="secondary hidden">Installieren</button>
      </div>
      <div class="nav-large">
        <h1 id="screen-title">Heute</h1>
      </div>
    </header>
    <main id="content" aria-live="polite"></main>
    <nav class="tabbar" aria-label="Hauptnavigation">
      <button data-tab="today" class="active" aria-label="Heute">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.2 10.5 12 3.6l8.8 6.9"/><path d="M5.4 12.2V20h4.3v-5h4.6v5h4.3v-7.8"/></svg>
        <small>Heute</small>
      </button>
      <button data-tab="library" aria-label="Bibliothek">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="4" width="4.2" height="16" rx="1.2"/><rect x="9.9" y="4" width="4.2" height="16" rx="1.2"/><path d="M16.6 5.3 20.4 4.6l2.1 15.1-3.8.7z"/></svg>
        <small>Bibliothek</small>
      </button>
      <button data-tab="learn" aria-label="Lernen">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="7.5" width="18" height="12.5" rx="2.4"/><path d="M6.4 4.4h11.2"/><path d="M8 12.6h8M8 16h5"/></svg>
        <small>Lernen</small>
      </button>
      <button data-tab="progress" aria-label="Fortschritt">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.6 20.4V4.2"/><path d="M3.6 20.4h16.8"/><path d="m7 15.4 3.6-4.3 3 2.6 4.4-5.6"/></svg>
        <small>Fortschritt</small>
      </button>
      <button data-tab="profile" aria-label="Profil">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8.2" r="3.7"/><path d="M4.8 20a7.2 7.2 0 0 1 14.4 0"/></svg>
        <small>Profil</small>
      </button>
    </nav>
  </div>
  <dialog id="modal" aria-label="Detailansicht">
    <div class="modal-card">
      <button class="modal-close" id="modal-close" type="button" aria-label="Schließen">✕</button>
      <div id="modal-content"></div>
    </div>
  </dialog>
  <input id="file-import" type="file" accept=".pdf,.txt,.md,.jpg,.jpeg,.png,.webp,.heic,.heif,text/plain,application/pdf,image/jpeg,image/png,image/webp,image/heic,image/heif" hidden>
  <input id="backup-import" type="file" accept="application/json,.json" hidden>
  <script type="module" src="ai-service.js"></script>
  <script type="module" src="import-ai.js"></script>
  <script type="module" src="app.js"></script>
  <script type="module" src="appearance.js"></script>
  <script type="module" src="profile-ai-mode.js"></script>
  <script type="module" src="cloud-settings.js"></script>
  <script type="module" src="ai-usage.js"></script>
  <script type="module" src="audit.js"></script>
  <script type="module" src="summaries-ai.js"></script>
  <script type="module" src="free-answer-ai.js"></script>
  <script type="module" src="exam-ai.js"></script>
  <script type="module" src="tutor-ai.js"></script>
  <script type="module" src="material-delete.js"></script>
</body>
</html>
